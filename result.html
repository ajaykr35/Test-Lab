<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Result - TestLab</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar">
      <div class="logo"><span>Test</span>Lab</div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="practice.html">Practice</a>
        <a href="history.html">History</a>

        <div class="user-profile" id="userProfile">
          <div class="user-avatar" id="userAvatar">U</div>
          <span id="userNameNav">User</span>
        </div>

        <a href="login.html" id="navLogin">Login</a>

        <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </nav>

    <main class="result-page">
      <div class="result-container">
        <div class="page-heading">
          <span class="section-label">TEST COMPLETED</span>

          <h1>Your Result</h1>

          <p>Here is a summary of your performance in this test.</p>
        </div>

        <section class="result-card">
          <div class="result-score">
            <span class="result-label">YOUR SCORE</span>

            <strong id="scoreValue">0/20</strong>

            <span id="scoreMessage"> Test completed </span>
          </div>

          <div class="result-stats">
            <div class="result-stat">
              <span>Correct</span>
              <strong id="correctValue">0</strong>
            </div>

            <div class="result-stat">
              <span>Wrong</span>
              <strong id="wrongValue">0</strong>
            </div>

            <div class="result-stat">
              <span>Skipped</span>
              <strong id="skippedValue">0</strong>
            </div>

            <div class="result-stat">
              <span>Accuracy</span>
              <strong id="accuracyValue">0%</strong>
            </div>
          </div>

          <div class="result-time">
            <div>
              <span>Total Test Time</span>
              <strong id="totalTimeValue">20 min</strong>
            </div>

            <div>
              <span>Time Used</span>
              <strong id="timeUsedValue">0 min</strong>
            </div>
          </div>

          <div class="result-actions">
            <a href="review.html" class="secondary-btn"> Review Answers </a>

            <a href="practice.html" class="primary-btn">
              Take Another Test →
            </a>
          </div>
        </section>
      </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/result.js"></script>
  </body>
</html>
