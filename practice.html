<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice - TestLab</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar">
      <div class="logo"><span>Test</span>Lab</div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="practice.html" class="active">Practice</a>
        <a href="history.html">History</a>

        <div class="user-profile" id="userProfile">
          <div class="user-avatar" id="userAvatar">U</div>
          <span id="userNameNav">User</span>
        </div>

        <a href="login.html" id="navLogin">Login</a>

        <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </nav>

    <main class="practice-page">
      <div class="practice-container">
        <div class="page-heading">
          <span class="section-label">PRACTICE TEST</span>

          <h1>Choose Your Test</h1>

          <p>
            Select a category, difficulty level and total test time to begin
            your placement preparation.
          </p>
        </div>

        <section class="practice-card">
          <div class="form-group">
            <label for="category">Test Category</label>

            <select id="category">
              <option value="Aptitude">Aptitude</option>
              <option value="Reasoning">Reasoning</option>
              <option value="Verbal Ability">Verbal Ability</option>
              <option value="CS Fundamentals">CS Fundamentals</option>
              <option value="Mixed Test">Mixed Test</option>
            </select>
          </div>

          <div class="form-group">
            <label for="difficulty">Difficulty</label>

            <select id="difficulty">
              <option value="Mixed">Mixed</option>
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
          </div>

          <div class="form-group">
            <label>Total Test Time</label>

            <div class="time-options">
              <button type="button" class="time-option" data-time="10">
                <strong>10 min</strong>
                <span>30 sec/question</span>
              </button>

              <button type="button" class="time-option" data-time="15">
                <strong>15 min</strong>
                <span>45 sec/question</span>
              </button>

              <button type="button" class="time-option active" data-time="20">
                <strong>20 min</strong>
                <span>60 sec/question</span>
              </button>

              <button type="button" class="time-option" data-time="30">
                <strong>30 min</strong>
                <span>90 sec/question</span>
              </button>

              <button type="button" class="time-option" data-time="40">
                <strong>40 min</strong>
                <span>120 sec/question</span>
              </button>

              <button type="button" class="time-option" data-time="60">
                <strong>60 min</strong>
                <span>180 sec/question</span>
              </button>
            </div>
          </div>

          <div class="practice-summary">
            <div>
              <span>Questions</span>
              <strong id="questionCount">20</strong>
            </div>

            <div>
              <span>Total Time</span>
              <strong id="selectedTime">20 min</strong>
            </div>

            <div>
              <span>Per Question</span>
              <strong id="perQuestionTime">60 sec</strong>
            </div>
          </div>

          <button type="button" id="startPracticeBtn" class="primary-btn">
            Continue to Instructions →
          </button>
        </section>
      </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/practice.js"></script>
  </body>
</html>
