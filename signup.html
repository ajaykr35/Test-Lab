<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - TestLab</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar">
      <div class="logo"><span>Test</span>Lab</div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="practice.html">Practice</a>
        <a href="history.html">History</a>

        <a href="login.html" id="navLogin"> Login </a>

        <div class="user-profile" id="userProfile">
          <div class="user-avatar" id="userAvatar">U</div>
          <span id="userNameNav">User</span>
        </div>

        <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </nav>

    <main class="auth-page">
      <div class="auth-container">
        <div class="auth-card">
          <div class="auth-header">
            <span class="section-label"> GET STARTED </span>

            <h1>Create Your Account</h1>

            <p>Create an account and start your placement preparation.</p>
          </div>

          <form id="signupForm">
            <div class="form-group">
              <label for="name"> Full Name </label>

              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
              />
            </div>

            <div class="form-group">
              <label for="email"> Email Address </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="form-group">
              <label for="password"> Password </label>

              <div class="password-field">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Create a password"
                  required
                />

                <button
                  type="button"
                  id="togglePassword"
                  class="password-toggle"
                >
                  Show
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="confirmPassword"> Confirm Password </label>

              <div class="password-field">
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Confirm your password"
                  required
                />

                <button
                  type="button"
                  id="toggleConfirmPassword"
                  class="password-toggle"
                >
                  Show
                </button>
              </div>
            </div>

            <p id="signupMessage" class="form-message"></p>

            <button type="submit" class="primary-btn auth-submit">
              Create Account
            </button>
          </form>

          <div class="auth-footer">
            <p>
              Already have an account?
              <a href="login.html"> Login </a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/signup.js"></script>
  </body>
</html>
